name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://trackflow:trackflow@localhost:5432/trackflow_test
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trackflow
          POSTGRES_PASSWORD: trackflow
          POSTGRES_DB: trackflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # ROOT NODE SETUP
      # --------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # --------------------------------------------
      # INSTALL ROOT, SERVER, CLIENT DEPENDENCIES
      # --------------------------------------------
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # --------------------------------------------
      # PRISMA + MIGRATIONS
      # --------------------------------------------
      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Run database migrations
        working-directory: server
        run: npx prisma migrate deploy

      # --------------------------------------------
      # BUILD FRONTEND
      # --------------------------------------------
      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3000
        run: npm run build

      # --------------------------------------------
      # TYPE-CHECK + LINT
      # --------------------------------------------
      - name: Lint + Type Check (Client)
        working-directory: client
        run: |
          npm run lint --if-present
          npm run type-check --if-present

      - name: Lint + Type Check (Server)
        working-directory: server
        run: |
          npm run lint --if-present
          npm run type-check --if-present
