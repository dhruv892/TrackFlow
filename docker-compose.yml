services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: trackflow
      POSTGRES_DB: trackflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://trackflow:trackflow@postgres:5432/trackflow
      NODE_ENV: production
    depends_on:
      - postgres
    ports:
      - "4000:3000"

  client:
    build: ./client
    environment:
      VITE_API_URL: http://server:3000
    depends_on:
      - server
    ports:
      - "5173:5173"
    # For local development, uncomment the following volume and command lines:
    # command: npm run dev -- --host 0.0.0.0 --port 5173
    # volumes:
    #   - ./client:/app
    #   - /app/node_modules # avoids conflicts

volumes:
  pgdata:
